    <style>
        .language-tabs {
    border-bottom: 0;
}

.language-tabs .nav-link {
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: #6b7280;
    font-size: 0.85rem;
    padding: 0.5rem 0;
    margin-right: 1.5rem;
}

.language-tabs .nav-link.active {
    border-bottom-color: #1a56db;
    color: #1f2937;
}

.translation-box {
    background-color: #f3f4f6;
}

.dialog-option {
    background-color: transparent;
    border: 1px solid transparent;
    color: #1f2937;
    text-align: left;
}

.dialog-option:hover {
    background-color: #f3f4f6;
}

.dialog-option.active {
    background-color: #fff;
    border-color: #1a56db;
    color: #1a56db;
}

                    data-bs-target="#languages-pane" role="tab" aria-controls="languages-pane"
                    aria-selected="true">Languages</button>
            </li>
            <li class="nav-item" role="presentation">
                <button type="button" class="nav-link" id="currency-tab" data-bs-toggle="tab"

                    aria-selected="false">Currency</button>
            </li>
        </ul>

    </div>
